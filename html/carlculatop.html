<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator design</title>
</head>
<style>
    body{
        background-color: blue;
    }
    .box{
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        width:400px;
        height: 500px; 
        border: 10px solid yellow;
        box-shadow: 10px 10px 24px rgb(0,0,0,.55),-10px -10px 24px rgba(255,255,255,.05);
    }
    .box h1{
        text-align: center;
        font-size: 20px;
    }
    input{
        width: 370px;
        margin-left: 10px;
        height: 50px;
        border: 01px solid ;
        font-size: 30px;
        margin-right: 10px;
        text-align: right;
        box-shadow: 10px 10px 24px rgb(0,0,0,.55),-10px -10px 24px rgba(255,255,255,.05);
        border-radius: 10px;

    }
    .button{
       grid-template-columns: repeat(4,1fr);
       gap: 10px; 
       display: grid;
       margin-top: 15px;
       
    }
    .button button{
        margin-top: 15px;
       padding: 16px;
       font-size: 18px;
       font-weight: bold;
       border: none;
       margin-left: 5px;
       margin-right: 5px;
       border-radius: 12px;
       transition: 0.2s;
    }
    #c{
        background: red;
        color: white;
    }
    #qual{
        background: green;
        color: black;
        margin-left: 10px;
        width: 250px;
        height: 40px;
        margin-top: 20px;
        font-size: 30px;

    }
    .orange{
        background: orange;
        color: black;
    }
    .blue{
        background: skyblue;
        color: black;
    }

</style>
<body>
    <div class="container">
        <div class="box">
            <h1>CALCULATOR</h1>
            <hr>
            <input type="text" placeholder="0">

            <div class="button">
                
                <button class="orange">+</button>
                <button class="orange">-</button>
                <button class="orange">*</button>
                <button class="orange">/</button>
                <button class="blue">7</button>
                <button class="blue">8</button>
                <button class="blue">9</button>
                <button class="blue">4</button>
                <button class="blue">5</button>
                <button class="blue">6</button>
                <button class="blue">1</button>
                <button class="blue">2</button>
                <button class="blue">3</button>
                <button class="blue">0</button>
                <button class="blue">.</button>
                <button id="c">C</button>
                

            </div>
            <button id="qual">=</button>
        </div>

    </div></body>
</html>
